[package]
name = "rztop"
description = "A desktop system monitor for Windows, forked from rtop"
version = "0.24.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/Roozi489/rtop"
authors = ["Freddie Haddad", "Roozi489"]
rust-version = "1.95"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui_dock = { version = "0.16", features = ["serde"] }
arc-swap = "1"
directories = "6"

serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
unicode-width = "0.2"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
    "Wdk_System_SystemServices",
]

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[dev-dependencies]
regex = "1"
